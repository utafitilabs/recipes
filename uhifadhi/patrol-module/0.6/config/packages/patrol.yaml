# Patrols (uhifadhi/patrol-module) — field patrol effort as first-class records:
# tracks, en-route observations with photographs, coverage and the per-user
# dashboard.
#
# NOTHING BELOW IS REQUIRED. Every key has a default, and the tree is CLOSED, so
# an invented key fails at compile time rather than being ignored. Delete the
# whole `patrol:` key and a fresh installation still runs — it simply uses the
# vocabulary written out below.
#
# WHAT THIS MODULE STANDS ON. Everything that is not about patrols arrives with
# `uhifadhi/uhifadhi`: the per-area catalogue this module's tile is filed in
# (registry), the page frame and the dashboard mechanics (shell), the people the
# records point at (team), the ground and its overview (area) and the maps the
# coverage plates draw on (atlas). The photographs arrive with
# `uhifadhi/storage-module`, and that one is a HARD requirement — the observation
# upload endpoint stores through it, so an installation that has not registered
# `Uhifadhi\Storage\UhifadhiStorageBundle` (alongside
# `League\FlysystemBundle\FlysystemBundle`) is told so at compile time rather
# than on its first upload.
#
# UNTIL THESE PACKAGES ARE ON PACKAGIST an installation names where they come
# from itself. Composer reads `repositories` from the ROOT package only — an
# entry in a dependency's own composer.json is ignored — so all three go in the
# application's composer.json, in the form the skeleton's install guide uses:
#
#   "repositories": [
#       { "type": "vcs", "url": "https://github.com/utafitilabs/uhifadhi" },
#       { "type": "vcs", "url": "https://github.com/utafitilabs/storage-module" },
#       { "type": "vcs", "url": "https://github.com/utafitilabs/patrol-module" }
#   ]
#
# with `"minimum-stability": "dev"` and `"prefer-stable": true` beside them,
# because composer will not resolve a transitive dev dependency under a stable
# floor.
patrol:
    # Which catalogue category the Patrols tile is filed under in every area.
    # OPERATIONS, because a patrol is the rangers' OWN work — `pressure` in the
    # catalogue means human pressure ON the ecosystem, and filing patrols there
    # files the people protecting alongside the thing they protect against.
    module_category: operations

    # THE DEPLOYMENT'S VOCABULARY, and it is words rather than code: one
    # deployment walks and drives, another patrols by boat. The KEY is the value
    # stored on every patrol and must not change once patrols carry it; the label
    # is only what a screen shows.
    types:
        foot:    { label: Foot }
        vehicle: { label: Vehicle }
        drone:   { label: Drone }

    # What an en-route observation can be, on the same terms: keys are stored,
    # labels are shown.
    observation_categories:
        wildlife:       { label: 'Wildlife sighting' }
        sign:           { label: 'Sign / evidence' }
        infrastructure: { label: Infrastructure }

    # How long a DISCARDED patrol survives before `patrol:purge-discarded`
    # deletes it and its photographs. Measured from the discard, and stopped
    # entirely while the patrol is held for review. `0` is legal and means "on
    # the next sweep" — a deployment that keeps nothing has a policy, not a bug.
    discard_retention_days: 90

    # A pause between consecutive GPX points longer than this counts as a GPS
    # gap: flagged on import and stored with the track, never smoothed away.
    gap_threshold_minutes: 5.0

# ---------------------------------------------------------------------------
# WHO THE RECORDS POINT AT — and why there is nothing to write here.
#
# Five columns on this module's tables name a PERSON: who led the patrol, who
# put it on hold, who recorded the observation, who acted on the event, who
# signed the amendment. None of them names an account class; all five are mapped
# to `Uhifadhi\Contracts\Entity\UserInterface`, and the core's TeamBundle — the
# package that actually provides the accounts — states the resolution from its
# own bundle. Whoever knows the answer states it, so an ordinary installation
# writes no doctrine line at all. `bin/console debug:config doctrine` shows the
# one that arrived.
#
# YOU WRITE A LINE ONLY TO DISAGREE — to name your own account class instead. It
# has to answer the contract's questions and be in the mapping chain, and it goes
# under the `orm:` key ALREADY IN config/packages/doctrine.yaml, beside
# `mappings`. Never as a second `doctrine:` key in that file: Symfony refuses to
# boot with `Duplicate key "doctrine" detected`.
#
#   doctrine:
#       orm:
#           resolve_target_entities:
#               Uhifadhi\Contracts\Entity\UserInterface: App\Entity\Person
#
# The application's own configuration wins over a prepended one, so naming your
# class is the whole of it — there is nothing to disable first.
#
# WHAT THOSE FIVE COLUMNS DO WHEN AN ACCOUNT GOES. They go null and the record
# stays. Removing somebody from the team does not un-walk the patrol they led,
# and a track with no lead is still a track that was walked.
#
# THEN, in this order:
#
#   bin/console doctrine:migrations:diff      # your history, your migration
#   bin/console doctrine:migrations:migrate
#   bin/console cache:clear
#   bin/console asset-map:compile
#
# The bundle ships entities, not migrations: the tables are the bundle's, but the
# migration history is yours, and a vendor replaying its own versions into it
# would fight every `diff` you ever run.
