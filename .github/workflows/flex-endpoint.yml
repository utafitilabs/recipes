name: Flex endpoint

on:
    push:
        branches: [main]

jobs:
    endpoint:
        runs-on: ubuntu-latest
        # The publish step pushes flex/main with GITHUB_TOKEN; without this the
        # token is read-only and the push 403s. See docs.github.com/actions/
        # security-guides/automatic-token-authentication#permissions-for-the-github_token
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'

            - name: Install recipes-checker
              run: |
                  git clone --depth 1 https://github.com/symfony-tools/recipes-checker.git ../recipes-checker
                  composer update -q -d ../recipes-checker --no-interaction

            - name: Generate endpoint
              # generate:flex-endpoint writes each <pkg>.<ver>.json into the output
              # dir with file_put_contents but never creates it — mkdir first or it
              # dies with "No such file or directory". See recipes-checker
              # GenerateFlexEndpointCommand::execute (writes straight to the path).
              run: |
                  mkdir -p endpoint-out
                  git ls-tree HEAD */*/* | php ../recipes-checker/run generate:flex-endpoint utafitilabs/recipes main flex/main endpoint-out

            - name: Publish flex/main
              run: |
                  cd endpoint-out
                  git init -q -b flex/main
                  git config user.name  'flex-endpoint[bot]'
                  git config user.email 'flex-endpoint@users.noreply.github.com'
                  git add -A
                  git commit -q -m "Regenerate Flex endpoint from $GITHUB_SHA"
                  git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/utafitilabs/recipes.git" flex/main
