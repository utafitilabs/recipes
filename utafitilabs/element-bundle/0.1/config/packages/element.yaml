# Element (utafitilabs/element-bundle) — the Twig component library: the card,
# the register table, the sortable header and the row that folds open, as
# components a page says rather than markup a page repeats.
#
# THIS FILE IS THE WHOLE OF THE DIFFERENCE BETWEEN ONE PRODUCT AND ANOTHER. The
# library ships one built stylesheet that paints with custom properties and
# decides not one value; everything below is rendered into the page by
# `element_theme()`, so two products install the same package unchanged and
# differ by colour and by type.
#
# NOTHING BELOW IS REQUIRED. Every key has a default — the values written out
# here ARE the defaults — and the tree is closed, so an invented key fails when
# the container is built rather than being ignored. Delete the whole `element:`
# key and the components still draw; keep it and change the handful of lines
# that make this deployment look like itself.
#
# A VALUE GOES INTO A `<style>` ELEMENT, so `<`, `>`, `{`, `}` and `;` are
# refused at compile time. That is a validation error you read, not an escape a
# reader never sees.
element:
    theme:
        # THE PALETTE, on paper. Light and dark are two complete palettes rather
        # than a filter over one: the dark half is stated under `dark:` below,
        # and hangs off `<html class="dark">`, which the application puts there
        # before the first paint so no page flashes the other one.
        colors:
            ground: 'rgb(243 242 235)'        # the page behind everything
            surface: 'rgb(255 255 255)'       # a card, at the top of its gradient
            surface_low: 'rgb(251 250 246)'   # the same card, at the bottom of it
            raised: 'rgb(236 235 226)'        # chips, fields, anything on a card
            ink: 'rgb(27 38 32)'              # primary text
            muted: 'rgb(87 100 90)'           # secondary text, and the rules mixed from it
            faint: 'rgb(118 132 122)'         # tertiary text
            accent: 'rgb(15 138 104)'         # the ONE accent: live state and calls to action
            accent_ink: 'rgb(255 255 255)'    # text that survives on the accent
            ok: 'rgb(30 122 70)'              # went well
            warn: 'rgb(154 107 20)'           # worth a look
            danger: 'rgb(186 66 39)'          # went wrong
            danger_ink: 'rgb(255 255 255)'    # text that survives on the danger fill
            critical: 'rgb(143 29 14)'        # still going wrong, and wants somebody now
            line: 'rgba(23, 38, 30, 0.11)'    # a border
            line_strong: 'rgba(23, 38, 30, 0.20)'   # a border that has to be seen

        # THE CATEGORICAL HUES — for telling CATEGORIES apart, and named by what
        # they look like, because what they MEAN is this product's. Map your own
        # categories onto them: BY NAME where a meaning has to stay put (a thing
        # that is moss today is moss next year), BY INDEX where a series just
        # needs colours that differ — `var(--e-hue-7)` is an alias of the
        # seventh name below, so restating a hue restates it once.
        #
        # The set is OPEN: restate any of these, append your own, and the rest
        # stay. It is also MEASURED — every hue stands at least 12.0 from every
        # other in CIE76 Lab distance and clears 4.5:1 against the ground it is
        # drawn on, in light and in dark. Add one and the bundle's own suite
        # (tests/Unit/Theme/HuePaletteTest.php) is where you check it still
        # holds; a category nobody can tell from its neighbour is not a category.
        hues:
            moss: '#1E7A46'
            ochre: '#8A6410'
            sky: '#15678F'
            rose: '#A83A52'
            plum: '#6A3FA8'
            indigo: '#3F3FB5'
            rust: '#94500D'
            magenta: '#8E2C70'
            slate: '#4C5C66'
            olive: '#5D622F'
            mauve: '#70518D'
            clay: '#894F3F'
            brick: '#AB341F'
            teal: '#096B5A'
            fern: '#376A0C'
            cobalt: '#265BB4'
            mulberry: '#894B64'
            orchid: '#903A9B'

        # The drop shadow a card carries.
        shadow: '0 6px 22px rgba(23, 38, 30, 0.10)'

        # TWO STACKS, and everything is set in one of them: `ui` for body and
        # headings, `mono` for tabs, table headers and figures. A webfont is
        # loaded by the page as usual and named here; the library never fetches
        # one.
        fonts:
            ui: '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif'
            mono: 'ui-monospace, SFMono-Regular, Menlo, monospace'

        # The corner of a card, and the height a control in a component row is
        # built to. Stated once: dark changes the palette, never the
        # measurements.
        radius: '14px'
        control_height: '32px'

        # THE SAME VALUES AGAIN, for a page marked `<html class="dark">`. Only
        # the palette and the shadow: a measurement does not change after dark.
        dark:
            colors:
                ground: 'rgb(12 19 16)'
                surface: 'rgb(21 32 25)'
                surface_low: 'rgb(17 26 20)'
                raised: 'rgb(28 41 33)'
                ink: 'rgb(234 242 236)'
                muted: 'rgb(150 168 156)'      # lifted, so muted text is not too dark
                faint: 'rgb(124 140 129)'
                accent: 'rgb(62 217 168)'
                accent_ink: 'rgb(12 19 16)'
                ok: 'rgb(99 201 127)'
                warn: 'rgb(219 163 63)'
                danger: 'rgb(224 91 65)'
                danger_ink: 'rgb(255 255 255)'
                critical: 'rgb(255 74 56)'
                line: 'rgba(216, 236, 224, 0.09)'
                line_strong: 'rgba(216, 236, 224, 0.17)'
            hues:
                moss: '#4FA86A'
                ochre: '#EFD27E'
                sky: '#5FB0E8'
                rose: '#E8899B'
                plum: '#B68BE8'
                indigo: '#8A87E8'
                rust: '#E0742E'
                magenta: '#DA7CB6'
                slate: '#9DAAB4'
                olive: '#A7A981'
                mauve: '#B69CCB'
                clay: '#CB9B8C'
                brick: '#ED8C74'
                teal: '#78B1A2'
                fern: '#8DB06D'
                cobalt: '#91A3E9'
                mulberry: '#CA98AA'
                orchid: '#D08FD6'
            shadow: '0 8px 26px rgba(0, 0, 0, 0.34)'

    table:
        # What a register says when it has no rows. Copy, therefore yours.
        empty_text: 'Nothing here yet.'

# ---------------------------------------------------------------------------
# THE TWO LINES THIS FILE CANNOT WRITE FOR YOU.
#
# 1. EVERY PAGE THAT DRAWS A COMPONENT calls the theme and then links the sheet
#    that spends it — in that order, in <head>, because a rule that reads a
#    property the page has not defined yet paints with nothing at all:
#
#      {{ element_theme() }}
#      <link rel="stylesheet" href="{{ asset(constant('UtafitiLabs\\ElementBundle\\UtafitiLabsElementBundle::STYLESHEET')) }}">
#
#    `element_theme()` is a lazy Twig runtime, so a page that never calls it
#    builds nothing.
#
# 2. `<html class="dark">` is the dark palette's switch, and the class goes on
#    before the first paint — an inline script in the document head, not a
#    stylesheet media query, so a reader who chose dark never sees light first.
#
# ---------------------------------------------------------------------------
# THE FOLD CONTROLLER, AND WHY IT IS NOT IN THIS RECIPE.
#
# The library ships one Stimulus controller, `utafitilabs--element-bundle--register-fold`,
# which owns the click on a register row's chevron. A recipe must not write
# `assets/controllers.json`: Flex rewrites that file wholesale from the
# `assets/package.json` of every installed package that carries the
# `symfony-ux` keyword — this one does, and declares the controller enabled — so
# an entry added here would be deleted by the next `composer update`.
#
# If a row will not fold, that is the pair of lines to check:
#
#   cat assets/controllers.json          # expects "@utafitilabs/element-bundle"
#   bin/console debug:asset-map | grep element-bundle
#
# The register still READS without it: the server renders open whatever the
# address names (`?open=a,b`), so a failed asset compile is a page somebody can
# read rather than a row of dead chevrons.
#
# ---------------------------------------------------------------------------
# AFTER INSTALLING:
#
#   bin/console cache:clear
#   bin/console asset-map:compile      # not optional: the sheet is served from
#                                      # the bundle's public/ directory
#
# THERE ARE NO MIGRATIONS AND NO PERMISSIONS. This package owns no table and
# remembers nothing; it is a library of components and a theme.
